# Totally not generated by DeepSeek out of my old nginx configs

location ~* ^/(config|data|incl)/ { deny all; return 403; }
location ~* \.json$ { deny all; return 403; }

# Cleanup: redirect URLs with incorrect .php extensions back to proper rewrite rules
location ~ ^/dashboard/profile/[\w\-]+/[\w\-]+\.php$ {
	rewrite ^/dashboard/profile/(.+)\.php$ /dashboard/profile/$1 permanent;
}
location ~ ^/dashboard/clan/[\w\-]+/[\w\-]+\.php$ {
	rewrite ^/dashboard/clan/(.+)\.php$ /dashboard/clan/$1 permanent;
}
location ~ ^/dashboard/browse/(levels|lists|mappacks|gauntlets|accounts|songs|sfxs)/[\w\-]+\.php$ {
	rewrite ^/dashboard/browse/([a-z]+)/(.+)\.php$ /dashboard/browse/$1/$2 permanent;
}
location ~ ^/dashboard/mod/roles/[\w\-]+\.php$ {
	rewrite ^/dashboard/mod/roles/(.+)\.php$ /dashboard/mod/roles/$1 permanent;
}
location ~ ^/dashboard/messenger/[\w\-]+/[\w\-]+\.php$ {
	rewrite ^/dashboard/messenger/(.+)\.php$ /dashboard/messenger/$1 permanent;
}

location ~ ^/sfx/ {
	rewrite ^/sfx/(.+)$ /sfx/handler.php?request=$1 last;
}

location ~ ^/music/ {
	rewrite ^/music/(.+)$ /music/handler.php?request=$1 last;
}

location ~ /dashboard/clan/ {
	rewrite ^/dashboard/clan/(.+)$ /dashboard/clan/index.php?id=$1 last;
}

location ~ /dashboard/profile/ {
	rewrite ^/dashboard/profile/(.+)$ /dashboard/profile/index.php?id=$1 last;
}

location ~ /dashboard/messenger/ {
	rewrite ^/dashboard/messenger/(.+)$ /dashboard/messenger/index.php?id=$1 last;
}

location ~ /dashboard/browse/levels/ {
	rewrite ^/dashboard/browse/levels/(.+)$ /dashboard/browse/levels.php?id=$1 last;
}

location ~ /dashboard/browse/lists/ {
	rewrite ^/dashboard/browse/lists/(.+)$ /dashboard/browse/lists.php?id=$1 last;
}

location ~ /dashboard/browse/mappacks/ {
	rewrite ^/dashboard/browse/mappacks/(.+)$ /dashboard/browse/mappacks.php?id=$1 last;
}

location ~ /dashboard/browse/gauntlets/ {
	rewrite ^/dashboard/browse/gauntlets/(.+)$ /dashboard/browse/gauntlets.php?id=$1 last;
}

location ~ /dashboard/browse/accounts/ {
	rewrite ^/dashboard/browse/accounts/(.+)$ /dashboard/browse/accounts.php?id=$1 last;
}

location ~ /dashboard/browse/songs/ {
	rewrite ^/dashboard/browse/songs/(.+)$ /dashboard/browse/songs.php?id=$1 last;
}

location ~ /dashboard/browse/sfxs/ {
	rewrite ^/dashboard/browse/sfxs/(.+)$ /dashboard/browse/sfxs.php?id=$1 last;
}

location ~ /dashboard/mod/roles/ {
	rewrite ^/dashboard/mod/roles/(.+)$ /dashboard/mod/roles.php?id=$1 last;
}

# General rewrite for dashboard pages without parameters
location ~ ^/dashboard/(account|browse|manage|mod|profile|clan|upload)/ {
	if (!-f $request_filename) {
		rewrite ^(/dashboard/[^?]*?)/([^/?]+)/?$ $1/$2.php last;
		rewrite ^(/dashboard/[^?]*?)/?$ $1.php last;
	}
}

location / {
	try_files $uri $uri/ @php;
}

location @php {
	rewrite ^([^?]*?)/?$ $1.php last;
}