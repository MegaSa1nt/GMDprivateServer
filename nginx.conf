# Totally not generated by DeepSeek out of my old nginx configs

# Block sensitive directories
location ~ ^/(config|data|incl)/ {
	deny all;
	return 403;
}

# Block JSON files
location ~ \.json$ {
	deny all;
	return 403;
}

# Media handlers
location /sfx/ {
	rewrite ^/sfx/(.+)$ /sfx/handler.php?request=$1 last;
}

location /music/ {
	rewrite ^/music/(.+)$ /music/handler.php?request=$1 last;
}

# Dashboard routes with parameters
location ~ ^/dashboard/(clan|profile|messenger)/(.+)$ {
	rewrite ^/dashboard/(clan|profile|messenger)/(.+)$ /dashboard/$1/index.php?id=$2 last;
}

location ~ ^/dashboard/browse/(levels|lists|mappacks|gauntlets|accounts|songs|sfxs)/(.+)$ {
	rewrite ^/dashboard/browse/(levels|lists|mappacks|gauntlets|accounts|songs|sfxs)/(.+)$ /dashboard/browse/$1.php?id=$2 last;
}

location ~ ^/dashboard/mod/roles/(.+)$ {
	rewrite ^/dashboard/mod/roles/(.+)$ /dashboard/mod/roles.php?id=$1 last;
}

# Generic .php extension addition for existing PHP files
location / {
	try_files $uri $uri/ $uri.php =404;
}